<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Virtual Polarimeter – Sugar Solution Experiment</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    text-align: center;
}

canvas {
    border: 2px solid #333;
    background: #fff;
    margin-top: 15px;
}

.controls {
    margin-top: 15px;
}

label {
    font-weight: bold;
}

.table-box {
    margin: 15px auto;
    width: 65%;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #333;
    padding: 6px;
}
</style>
</head>

<body>

<h2>Virtual Polarimeter Experiment (Sugar Solution)</h2>
<p>Pour the solution, rotate analyzer, and observe optical rotation</p>

<div class="controls">
    <label>Tilt Angle (°): </label>
    <input type="range" id="tiltSlider" min="0" max="60" value="0">
    <span id="tiltValue">0</span>°
    <br><br>

    <label>Sugar Concentration (g/mL): </label>
    <input type="number" id="concentration" value="0.2" step="0.05">
    <br><br>

    <label>Analyzer Rotation (°): </label>
    <input type="range" id="analyzer" min="-30" max="30" value="0">
    <span id="analyzerValue">0</span>°
</div>

<canvas id="labCanvas" width="900" height="450"></canvas>

<p>
<b>Calculated Optical Rotation (α):</b>
<span id="rotation">0</span>°
</p>

<div class="table-box">
<table>
<tr>
    <th>Concentration (g/mL)</th>
    <th>Tube Filled (%)</th>
    <th>Optical Rotation (°)</th>
</tr>
<tr>
    <td id="obsC">0.2</td>
    <td id="obsL">0</td>
    <td id="obsA">0</td>
</tr>
</table>
</div>

<script>
const canvas = document.getElementById("labCanvas");
const ctx = canvas.getContext("2d");

const tiltSlider = document.getElementById("tiltSlider");
const analyzerSlider = document.getElementById("analyzer");
const concentrationInput = document.getElementById("concentration");

const rotationText = document.getElementById("rotation");
const obsC = document.getElementById("obsC");
const obsL = document.getElementById("obsL");
const obsA = document.getElementById("obsA");

let beaker = { x: 230, y: 230, angle: 0 };
let tube = { x: 600, y: 100, width: 45, height: 220, fill: 0, maxFill: 180 };

/* ===== BEAKER STYLING ===== */
function drawBeaker() {
    ctx.save();
    ctx.translate(beaker.x, beaker.y);
    ctx.rotate(beaker.angle * Math.PI / 180);

    // glass body
    ctx.beginPath();
    ctx.roundRect(-45, -65, 90, 130, 12);
    ctx.strokeStyle = "#555";
    ctx.lineWidth = 2;
    ctx.stroke();

    // liquid
    ctx.fillStyle = "rgba(0,150,255,0.35)";
    ctx.beginPath();
    ctx.roundRect(-40, 15, 80, 35, 8);
    ctx.fill();

    // meniscus
    ctx.beginPath();
    ctx.moveTo(-40, 15);
    ctx.quadraticCurveTo(0, 10, 40, 15);
    ctx.strokeStyle = "rgba(0,120,220,0.9)";
    ctx.stroke();

    ctx.restore();
}

/* ===== POLARIMETER TUBE STYLING ===== */
function drawTube() {
    // outer glass
    ctx.beginPath();
    ctx.roundRect(tube.x - 6, tube.y - 6, tube.width + 12, tube.height + 12, 18);
    ctx.strokeStyle = "#444";
    ctx.lineWidth = 2;
    ctx.stroke();

    // inner tube
    ctx.beginPath();
    ctx.roundRect(tube.x, tube.y, tube.width, tube.height, 15);
    ctx.strokeStyle = "#aaa";
    ctx.stroke();

    // liquid
    ctx.fillStyle = "rgba(0,150,255,0.55)";
    ctx.beginPath();
    ctx.roundRect(
        tube.x + 2,
        tube.y + tube.height - tube.fill,
        tube.width - 4,
        tube.fill,
        10
    );
    ctx.fill();

    // meniscus
    ctx.beginPath();
    ctx.moveTo(tube.x + 2, tube.y + tube.height - tube.fill);
    ctx.quadraticCurveTo(
        tube.x + tube.width / 2,
        tube.y + tube.height - tube.fill - 6,
        tube.x + tube.width - 2,
        tube.y + tube.height - tube.fill
    );
    ctx.strokeStyle = "rgba(0,120,220,0.9)";
    ctx.stroke();

    // stand
    ctx.fillStyle = "#666";
    ctx.fillRect(tube.x - 15, tube.y + tube.height + 12, tube.width + 30, 6);
}

/* ===== ANALYZER DIAL ===== */
function drawAnalyzerDial() {
    ctx.beginPath();
    ctx.arc(760, 220, 45, 0, Math.PI * 2);
    ctx.strokeStyle = "#333";
    ctx.stroke();

    let angle = analyzerSlider.value * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(760, 220);
    ctx.lineTo(760 + 40 * Math.cos(angle), 220 + 40 * Math.sin(angle));
    ctx.strokeStyle = "red";
    ctx.stroke();
}

/* ===== POURING LOGIC ===== */
function pourLiquid() {
    if (beaker.angle > 25 && tube.fill < tube.maxFill) {
        tube.fill += 0.6;

        ctx.beginPath();
        ctx.moveTo(beaker.x + 40, beaker.y);
        ctx.lineTo(tube.x + tube.width / 2, tube.y);
        ctx.strokeStyle = "rgba(0,120,255,0.8)";
        ctx.lineWidth = 3;
        ctx.stroke();
    }
}

/* ===== OPTICAL ROTATION ===== */
function calculateRotation() {
    // α = [α] × l × c
    let specificRotation = 66.5; // sucrose
    let concentration = parseFloat(concentrationInput.value);
    let pathLength = tube.fill / tube.maxFill;

    let alpha = specificRotation * pathLength * concentration;
    rotationText.textContent = alpha.toFixed(2);

    obsC.textContent = concentration.toFixed(2);
    obsL.textContent = Math.round(pathLength * 100);
    obsA.textContent = alpha.toFixed(2);
}

/* ===== MAIN LOOP ===== */
function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    beaker.angle = tiltSlider.value;
    document.getElementById("tiltValue").textContent = beaker.angle;
    document.getElementById("analyzerValue").textContent = analyzerSlider.value;

    drawBeaker();
    drawTube();
    drawAnalyzerDial();
    pourLiquid();
    calculateRotation();

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
